$font = Monospace

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(255, 255, 255, 0)
    check_color = rgba(255, 255, 255, 0)
    fail_color = rgba(255, 200, 200, 0)

    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    rounding = 0

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL

    # dots_text_format = =
    dots_spacing = 0.3
	dots_size = 0.5

    # hide_input = true

    position = 0, -70
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME     
	font_size = 90
    font_family = $font

    position = 0, 150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, 40
    halign = center
    valign = center
}
